<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Ecuador | Trip Planner</title>

    <meta name="description" content="Plan your trip to Ecuador.">
    <meta name="author" content="Luis Pacheco">

    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/large.css">

    <script src="scripts/trip.js" defer></script>
</head>

<body>

    <header>
        <h1>Explore Ecuador</h1>

        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="trip.html" class="active">Trip Planner</a></li>
                <li><a href="references.html">References</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="form-section">

            <h2>Plan Your Ecuador Adventure</h2>

            <p>
                Complete the form below to save your travel preferences.
            </p>

            <form id="tripForm">

                <label for="name">
                    Full Name
                </label>

                <input type="text" id="name" name="name" required>

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" required>

                <label for="destination">
                    Preferred Destination
                </label>

                <select id="destination" name="destination" required>

                    <option value="">Choose a Destination</option>
                    <option value="Quito">Quito</option>
                    <option value="Cuenca">Cuenca</option>
                    <option value="Guayaquil">Guayaquil</option>
                    <option value="Montañita">Montañita</option>
                    <option value="Amazon Rainforest">Amazon Rainforest</option>
                    <option value="Galápagos Islands">Galápagos Islands</option>

                </select>

                <label for="travelers">
                    Number of Travelers
                </label>

                <input type="number" id="travelers" min="1" max="20" required>

                <label for="travelDate">
                    Travel Date
                </label>

                <input type="date" id="travelDate" required>

                <label for="comments">
                    Additional Comments
                </label>

                <textarea id="comments" rows="5"></textarea>

                <input type="submit" value="Save Trip Plan">

            </form>

            <div id="message"></div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 | Luis Pacheco | WDD131 Ecuador Project</p>

        <p>
            <a href="references.html">References</a>
        </p>
    </footer>

</body>

</html>
