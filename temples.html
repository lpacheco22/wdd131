<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album</title>

    <meta name="description" content="Responsive Temple Album for WDD131 class.">
    <meta name="author" content="Luis Pacheco">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <h1>Temple Album</h1>

        <button id="menu" aria-label="Menu"></button>

        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h2>Home</h2>

        <div class="gallery">

            <figure>
                <img src="images/salt_lake_temple_renovation_rendering.jpeg"
                    alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome_italy_temple.jpeg"
                    alt="Rome Temple" loading="lazy">
                <figcaption>Rome Temple</figcaption>
            </figure>

            <figure>
                <img src="images/tokyo_japan_temple.jpeg"
                    alt="Tokyo Temple" loading="lazy">
                <figcaption>Tokyo Temple</figcaption>
            </figure>

            <figure>
                <img src="images/paris_france_temple_exterior.jpeg"
                    alt="Paris Temple" loading="lazy">
                <figcaption>Paris Temple</figcaption>
            </figure>

            <figure>
                <img src="images/guayaquil_ecuador_temple_lds.jpeg"
                    alt="Guayaquil Temple" loading="lazy">
                <figcaption>Guayaquil Temple</figcaption>
            </figure>

            <figure>
                <img src="images/mexico_city_temple_lds.jpeg"
                    alt="Mexico City Temple" loading="lazy">
                <figcaption>Mexico City Temple</figcaption>
            </figure>

            <figure>
                <img src="images/manila_philippines_temple_lds.jpeg"
                    alt="Manila Temple" loading="lazy">
                <figcaption>Manila Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple_rendering_provo_utah_rock_canyon_temple.jpeg"
                    alt="Provo Temple" loading="lazy">
                <figcaption>Provo Temple</figcaption>
            </figure>

            <figure>
                <img src="images/jordan_river_temple_exterior_images.jpeg"
                    alt="Jordan River Temple" loading="lazy">
                <figcaption>Jordan River Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Luis Pacheco | Ecuador
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
